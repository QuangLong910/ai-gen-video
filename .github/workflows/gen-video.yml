name: Tạo Video Nhanh Từ Link Báo (Hóng Hớt 24/7)

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: 'Dán Link bài báo HOẶC dán Đoạn tóm tắt tin tức:'
        required: true
        type: string
      target_duration:
        description: 'Thời lượng video mong muốn (ví dụ: 30s hoặc 45s, để trống = tự động ~38s):'
        required: false
        default: '38s'
        type: string

jobs:
  generate-video:
    name: 🎬 Render Video Nét Gốc (1080x1920)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 📥 Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🐍 Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Cài đặt Pillow cho Python
        run: pip install pillow

      - name: ⚡ Tận dụng Cache trình duyệt Remotion (Bỏ qua tải lại)
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            remotion-browser-${{ runner.os }}-

      - name: 🎥 Cài đặt thư viện hệ thống cần thiết (Chạy ngầm siêu tốc, không bị treo)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ffmpeg \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libasound2* \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libgbm-dev \
            libcups2 \
            libcairo2 \
            libpango-1.0-0 \
            libatk-bridge2.0-0 || true

      - name: 📦 Cài đặt npm dependencies
        run: npm ci || npm install

      - name: 🌐 Cài đặt trình duyệt cho Remotion
        run: npx remotion browser ensure

      - name: 🚀 Chạy Pipeline Tạo Video & Gửi Về Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/tele-bot-service.mjs "${{ inputs.article_url }}" "${{ inputs.target_duration }}"

      - name: 💾 Lưu Video vào GitHub Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-honghot247-${{ github.run_id }}
          path: videos/*/output/video.mp4
          retention-days: 14

      - name: 📱 Xuất Video ra GitHub Releases (Tải 1-chạm thẳng vào điện thoại không cần giải nén zip)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIDEO_PATH=$(ls videos/*/output/video.mp4 | head -n 1)
          if [ -f "$VIDEO_PATH" ]; then
            TAG="v-$(date +'%Y%m%d-%H%M%S')"
            gh release create "$TAG" "$VIDEO_PATH#video.mp4" \
              --title "🎬 Video $(date +'%d/%m/%Y %H:%M')" \
              --notes "Bấm vào file video.mp4 bên dưới để lưu thẳng vào Thư viện ảnh / Tệp trên điện thoại." \
              --latest
          fi

